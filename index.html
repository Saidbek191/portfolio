<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <script type="module" src="./js/main.js" defer></script>
    <title>Saidbek Kodirov</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header__logo">
          <img src="assets/images/logo-black.svg" alt="logo" />
          <a href="#home">Saidbek Kodirov</a>
        </div>
        <nav class="header__nav">

        <div class="header__btns-wrapper">
          <div class="language">
            <button class="language__current">EN</button>
            <ul class="language__list">
              <li data-lang="en">EN</li>
              <li data-lang="pl">PL</li>
              <li data-lang="ru">RU</li>

  <footer class="footer">

      <div class="footer__wrapper">
        <div class="footer__logo">
          <img src="./assets/images/logo-white.svg" alt="footer-logo" />
